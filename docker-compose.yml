services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumnia
      POSTGRES_PASSWORD: lumnia
      POSTGRES_DB: lumnia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumnia -d lumnia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
